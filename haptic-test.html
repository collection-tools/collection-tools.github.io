<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>触覚テスト</title>
<style>
body{font:16px -apple-system,sans-serif;margin:16px;background:#fff;color:#111}
button{display:block;width:100%;height:56px;margin:10px 0;font:inherit;font-size:17px;font-weight:700;border:1px solid #ccc;border-radius:12px;background:#f2f2f2}
#log{margin-top:16px;color:#555;font-size:14px;white-space:pre-wrap}
.vis{position:fixed;left:16px;bottom:16px}
</style></head><body>
<h3>触覚テスト</h3>
<p>下のボタンを1つずつ押して、カチッと感じたものを教えて。</p>
<button id="a">A：隠しスイッチをlabelでクリック</button>
<button id="b">B：画面内のスイッチをlabelでクリック</button>
<button id="c">C：隠しスイッチを直接クリック</button>
<button id="d">D：vibrate</button>
<div id="log"></div>
<label id="la" style="position:fixed;left:-100px;top:-100px;width:1px;height:1px;opacity:0;pointer-events:none"><input type="checkbox" switch id="ia" tabindex="-1"></label>
<label id="lb" class="vis"><input type="checkbox" switch id="ib"> 見えるスイッチ</label>
<input type="checkbox" switch id="ic" style="position:fixed;left:-100px;top:-100px;opacity:0">
<script>
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
log('vibrate: '+(navigator.vibrate?'あり':'なし')+' / standalone: '+(navigator.standalone?'はい':'いいえ'));
a.onclick=()=>{la.click();log('A 実行')};
b.onclick=()=>{lb.click();log('B 実行')};
c.onclick=()=>{ic.click();log('C 実行')};
d.onclick=()=>{try{log('D '+(navigator.vibrate?navigator.vibrate(30):'なし'))}catch(e){log('D エラー')}};
</script></body></html>
